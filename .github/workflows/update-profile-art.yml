name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch contributions
        env:
          GH_PROFILE_USER: WIKItills
        run: python scripts/fetch_contributions.py
      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Commit updated art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ contrib-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution art"
          git push
