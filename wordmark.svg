  <circle fill="#27c93f" cx="54" cy="14" r="5.5"/>
  <text fill="#7d8590" font-family="monospace" font-size="12" x="462" y="18" text-anchor="middle">wikitills@github: ~$ ./wordmark.sh --3d</text>
